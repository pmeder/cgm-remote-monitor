version: '3'

x-logging: &default-logging
  options:
    max-size: '10m'
    max-file: '5'
  driver: json-file

services:
  mongo:
    image: mongo:5.0.32
    restart: always
    volumes:
      - mongo-data:/data/db
    logging: *default-logging

  nightscout:
    image: nightscout/cgm-remote-monitor:latest
    container_name: nightscout
    restart: always
    depends_on:
      - mongo
    networks:
      - default
      - dokploy-network
    logging: *default-logging
    environment:
      ### Variables for the container
      NODE_ENV: production
      TZ: ${TZ:-Etc/UTC}

      ### Overridden variables for Docker Compose setup
      # The `nightscout` service can use HTTP, because we use `traefik` to serve the HTTPS
      # and manage TLS certificates
      INSECURE_USE_HTTP: 'true'
      # Listen on all container interfaces so reverse proxies and other containers can reach Nightscout
      NIGHTSCOUT_HOSTNAME: '0.0.0.0'
      # Nightscout liest HOSTNAME (lib/server/env.js), nicht NIGHTSCOUT_HOSTNAME.
      # Ohne diese Zeile bindet es an den Container-Hostnamen und ist je nach
      # Netzwerk-Reihenfolge fuer den Reverse Proxy nicht erreichbar.
      HOSTNAME: '0.0.0.0'

      # For all other settings, please refer to the Environment section of the README
      ### Required variables
      # MONGO_CONNECTION - The connection string for your Mongo database.
      # Something like mongodb://sally:sallypass@ds099999.mongolab.com:99999/nightscout
      # The default connects to the `mongo` included in this docker-compose file.
      # If you change it, you probably also want to comment out the entire `mongo` service block
      # and `depends_on` block above.
      MONGO_CONNECTION: mongodb://mongo:27017/nightscout

      API_SECRET: ${API_SECRET}

      ### Features
      # ENABLE - Used to enable optional features, expects a space delimited list, such as: careportal rawbg iob
      # See https://github.com/nightscout/cgm-remote-monitor#plugins for details
      ENABLE: ${ENABLE:-careportal rawbg iob}

      # AUTH_DEFAULT_ROLES (readable) - possible values readable, denied, or any valid role name.
      # When readable, anyone can view Nightscout without a token. Setting it to denied will require
      # a token from every visit, using status-only will enable api-secret based login.
      AUTH_DEFAULT_ROLES: ${AUTH_DEFAULT_ROLES:-denied}
      DISPLAY_UNITS: ${DISPLAY_UNITS:-mg/dl}
      LANGUAGE: ${LANGUAGE:-en}
      TIME_FORMAT: ${TIME_FORMAT:-12}
      DEVICESTATUS_ADVANCED: ${DEVICESTATUS_ADVANCED:-true}
      SHOW_PLUGINS: ${SHOW_PLUGINS:-dbsize}
      BASAL_RENDER: ${BASAL_RENDER:-none}
      BOLUS_RENDER_OVER: ${BOLUS_RENDER_OVER:-0.5}
      BG_TARGET_TOP: ${BG_TARGET_TOP:-180}
      BG_TARGET_BOTTOM: ${BG_TARGET_BOTTOM:-80}
      # For all other settings, please refer to the Environment section of the README
      # https://github.com/nightscout/cgm-remote-monitor#environment

networks:
  dokploy-network:
    external: true

volumes:
  mongo-data:
    name: nightscout-mongo-data
    external: true
